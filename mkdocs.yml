site_name: Manual do Sistema
site_description: Documentação oficial do sistema

theme:
  name: material
  language: pt-BR

  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Ativar modo escuro

    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Ativar modo claro

  font:
    text: Inter
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Início: index.md
  - Introdução: introducao.md
  - Instalação: instalacao.md
  - Perguntas frequentes: perguntas-frequentes.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
